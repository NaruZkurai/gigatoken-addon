[package]
name = "gigatoken-addon"
version = "0.1.0"
edition = "2021"
description = "Local tokenizer addon for DeepSeek Harness: pulls the model server's tokenizer.json (/v1/chat_tokenizer), tokenizes the prompt locally with gigatoken, and sends the pre-tokenized ids via /v1/chat_pretokenized so the server never tokenizes the prompt."

[lib]
name = "gigatoken_addon"
crate-type = ["cdylib", "lib"]

[dependencies]
# gigatoken: the local BPE/SentencePiece tokenizer that consumes the server's
# tokenizer.json byte-for-byte. Its [lib] name is `gigatoken_rs`, so the
# dependency key matches that so Rust imports it as `gigatoken_rs`.
gigatoken_rs = { package = "gigatoken", path = "gigatoken-src", default-features = false, features = ["llama-cpp"] }

# libloading: optional runtime load of the gigatoken C-ABI cdylib for the
# classic create-from-GGUF-tables path.
libloading = "0.8"
